server:
  port: 8080

spring:
  application:
    name: reggie_2402
  datasource:
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: "jdbc:mysql://localhost:3306/db_reggie?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true"
      username: root
      password: root

mybatis-plus:
  configuration:
       # 下划线转驼峰映射：数据库字段 create_time 自动映射为实体属性 createTime
    map-underscore-to-camel-case: true
       # 控制台输出 SQL 日志，方便调试
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 雪花算法自动生成主键
     id-type: ASSIGN_ID
      # 常量配置：图片存放目录（目录不存在时代码会自动创建）
reggie:
  path: D:\img\

# 大模型配置：OpenAI 兼容端点，支持切换为其他兼容模型，代码不改
llm:
  base-url: https://api.deepseek.com/v1
  model: deepseek-chat
  api-key: 请在此填写你自己的 API Key，勿提交到代码仓库
  temperature: 0.2