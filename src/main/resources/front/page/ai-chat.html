<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瑞吉外卖 - 智能客服</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f5f5; }
        .chat-container { max-width: 600px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; background: #fff; }
        .chat-header { padding: 14px; text-align: center; font-size: 17px; font-weight: 600; color: #fff; background: #ffc200; }
        .msg-list { flex: 1; overflow-y: auto; padding: 16px; }
        .msg { margin-bottom: 12px; display: flex; }
        .msg.user { justify-content: flex-end; }
        .msg .bubble { max-width: 75%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; font-size: 15px; word-break: break-word; white-space: pre-wrap; }
        .msg.user .bubble { background: #ffc200; color: #333; border-bottom-right-radius: 2px; }
        .msg.ai .bubble { background: #f0f0f0; color: #333; border-bottom-left-radius: 2px; }
        .input-bar { display: flex; padding: 10px; border-top: 1px solid #eee; }
        .input-bar input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 20px; outline: none; font-size: 15px; }
        .input-bar button { margin-left: 8px; padding: 0 20px; border: none; border-radius: 20px; background: #ffc200; color: #333; font-size: 15px; cursor: pointer; }
        .input-bar button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">瑞吉外卖 · 智能客服</div>
    <div class="msg-list" id="msgList">
        <div class="msg ai"><div class="bubble">您好，我是瑞吉外卖智能客服。您可以问我"我的订单到哪了""我上次点了什么""有什么辣菜"等问题～</div></div>
    </div>
    <div class="input-bar">
        <input id="questionInput" type="text" placeholder="请输入您的问题..." autofocus>
        <button id="sendBtn" onclick="send()">发送</button>
    </div>
</div>
<script>
    var msgList = document.getElementById('msgList');
    var input = document.getElementById('questionInput');
    var sendBtn = document.getElementById('sendBtn');

    // 回车发送
    input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') send();
    });

    function appendMsg(role, text) {
        var div = document.createElement('div');
        div.className = 'msg ' + role;
        var bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        div.appendChild(bubble);
        msgList.appendChild(div);
        msgList.scrollTop = msgList.scrollHeight;
        return bubble;
    }

    function send() {
        var question = input.value.trim();
        if (!question) return;
        appendMsg('user', question);
        input.value = '';
        sendBtn.disabled = true;
        var thinking = appendMsg('ai', '正在思考...');
        // 调用后端知识问答接口（需用户端已登录，否则返回 NOTLOGIN）
        fetch('/ai/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question: question })
        })
            .then(function (res) { return res.json(); })
            .then(function (r) {
                if (r.code === 1) {
                    thinking.textContent = r.data;
                } else if (r.msg === 'NOTLOGIN') {
                    thinking.textContent = '请先在用户端登录后再使用智能客服～';
                } else {
                    thinking.textContent = r.msg || '服务暂时不可用，请稍后再试';
                }
            })
            .catch(function () {
                thinking.textContent = '网络异常，请稍后再试';
            })
            .finally(function () {
                sendBtn.disabled = false;
                input.focus();
            });
    }
</script>
</body>
</html>
